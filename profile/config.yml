compaction:
  enabled: true
  thresholdTokens: 128000
  keepRecentTokens: 20000
  midTurnEnabled: true
  thresholdPercent: 50
  methodOrder:
    - soft
    - shake
    - handoff
  dropUseless: true
  supersedeReads: true
  experimentalContextManagement: true
provider:
  appendOnlyContext: "on"
providers:
  cacheWarming: idle
  cacheRetention: long
modelRoles:
  default: magpie/group/theorist
  judge: magpie-decisions/group/decider
  smol: magpie/group/labor
  tiny: magpie/group/labor
  memory: magpie/group/labor
  task: magpie/group/fusion-flattened
task:
  eager: always
  structured: true
  enableEffort: true
  isolation:
    enabled: true
    merge: branch
    apply: false
bash:
  gitGuard: true
  allowCompoundCommands: true
browser:
  tern: true
  idleCloseSec: 300
extensionRenderers:
  transcriptPresenters: true
  assistantText: true
goal:
  enabled: true
  continuationModes:
    - interactive
    - rpc
async:
  enabled: true
  printWake: true
interruptMode: wait
setupVersion: 3
dev:
  autoqaConsent: granted